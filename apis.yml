description: Nested is a modern, technology-enabled UK estate agency that helps people sell, buy, and let
  residential property. It pairs hyper-local human agents with a digital platform and mobile app that give
  sellers transparency across the transaction, listing homes on major portals such as Rightmove, Zoopla, and
  OnTheMarket. Nested was surfaced as a portfolio company of balderton-capital and northzone and added to the
  API Evangelist network. The company operates a consumer-facing service and does not publish a public
  developer API, developer portal, or technical documentation at this time.
